{% if campo.field.widget.input_type == "checkbox" %}
<label class="check{% if campo.errors %} con-error{% endif %}">{{ campo }} <span>{{ campo.label }}</span></label>
{% else %}
<label for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}
{% endif %}
{% for e in campo.errors %}<div class="campo-error">{{ e }}</div>{% endfor %}
