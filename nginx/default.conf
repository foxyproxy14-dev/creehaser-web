# Resolver de Docker: vuelve a buscar la IP de "web" cada 10 s,
# así un "docker compose up --build" no deja a nginx apuntando a una IP vieja (502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;   # fotos subidas desde el celular
    server_tokens off;

    location /static/ {
        alias /data/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /data/media/;
        expires 7d;
        access_log off;
    }

    location / {
        set $django http://web:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El proxy inverso de afuera termina el HTTPS y nos dice el protocolo original
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
