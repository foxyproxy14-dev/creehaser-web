# CreeHaSer Web
#   db    → PostgreSQL (solo accesible dentro de Docker)
#   web   → Django + Gunicorn
#   nginx → sirve fotos y estáticos y pasa el resto a Django
# Tu proxy inverso debe apuntar a http://IP-DE-ESTA-VM:${HTTP_PORT} (por defecto 8080).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_STATIC_ROOT: /data/static
      DJANGO_MEDIA_ROOT: /data/media
    volumes:
      - static:/data/static
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/data/static:ro
      - media:/data/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  static:
  media:
